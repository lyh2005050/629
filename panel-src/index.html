<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务器监控</title>
<style>
  :root{
    --green:#20a53a; --green-l:#e8f5ec; --orange:#fb7d00; --red:#fc6d26;
    --bg:#f6f6f6; --card:#fff; --line:#ececec; --txt:#333; --sub:#999; --txt2:#666;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"微软雅黑","Microsoft YaHei",Arial,Helvetica,sans-serif;font-size:13px}
  .topbar{background:var(--green);color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
  .topbar .brand{font-size:17px;font-weight:700;letter-spacing:1px}
  .topbar .meta{font-size:12px;opacity:.92;display:flex;flex-wrap:wrap;gap:6px 16px}
  .topbar .meta b{font-weight:600}
  .topbar .status{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block}
  .dot.on{background:#d6ffd6}
  .dot.off{background:#ffd6d6}
  main{max-width:1200px;margin:0 auto;padding:16px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.cards{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .card h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between}
  .card .big{font-size:26px;font-weight:700;color:var(--txt)}
  .card .big small{font-size:13px;color:var(--sub);font-weight:400;margin-left:4px}
  .card .sub{margin-top:8px;font-size:12px;color:var(--txt2);line-height:1.7}
  .bar{height:8px;background:#f0f0f0;border-radius:5px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;border-radius:5px;background:var(--green);transition:width .5s}
  .bar.warn i{background:var(--orange)}
  .bar.bad i{background:var(--red)}
  .charts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
  @media(max-width:900px){.charts{grid-template-columns:1fr}}
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
  .chart-card h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:10px}
  .chart-card canvas{width:100%;height:110px;display:block}
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:900px){.panes{grid-template-columns:1fr}}
  .pane{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
  .pane h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:10px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  th{color:var(--sub);font-weight:600;background:#fafafa}
  td.num,th.num{text-align:right}
  td.cmd{white-space:normal;max-width:220px;color:var(--txt2)}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px}
  .tag.ok{background:var(--green-l);color:var(--green)}
  .empty{color:var(--sub);padding:14px 0;text-align:center;font-size:12px}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:6px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:10px;height:3px;border-radius:2px;display:inline-block}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">服务器监控</div>
  <div class="meta">
    <span>主机 <b id="m-hostname">-</b></span>
    <span>系统 <b id="m-os">-</b></span>
    <span>内核 <b id="m-kernel">-</b></span>
    <span>运行 <b id="m-uptime">-</b></span>
    <span>时间 <b id="m-time">-</b></span>
  </div>
  <div class="status"><span id="dot" class="dot on"></span><span id="status-text">连接中…</span></div>
</header>

<main>
  <section class="cards">
    <div class="card">
      <h3>CPU <span id="cpu-cores"></span></h3>
      <div class="big"><span id="cpu-pct">-</span><small>%</small></div>
      <div class="bar" id="cpu-bar"><i></i></div>
      <div class="sub">负载 1/5/15：<span id="cpu-load">-</span></div>
    </div>
    <div class="card">
      <h3>内存</h3>
      <div class="big"><span id="mem-used">-</span><small>/ <span id="mem-total">-</span></small></div>
      <div class="bar" id="mem-bar"><i></i></div>
      <div class="sub">可用 <span id="mem-avail">-</span>　缓存 <span id="mem-cached">-</span></div>
    </div>
    <div class="card">
      <h3>Swap</h3>
      <div class="big"><span id="swap-used">-</span><small>/ <span id="swap-total">-</span></small></div>
      <div class="sub" id="swap-sub">交换分区使用情况</div>
    </div>
    <div class="card">
      <h3>网络</h3>
      <div class="big">↓<span id="net-rx">-</span><small>/s</small></div>
      <div class="big" style="font-size:18px;margin-top:4px">↑<span id="net-tx">-</span><small>/s</small></div>
      <div class="sub">累计 ↓<span id="net-rxt">-</span>　↑<span id="net-txt">-</span></div>
    </div>
  </section>

  <section class="charts">
    <div class="chart-card">
      <h3>CPU 使用率（%）</h3>
      <canvas id="cpu-chart"></canvas>
    </div>
    <div class="chart-card">
      <h3>内存使用率（%）</h3>
      <canvas id="mem-chart"></canvas>
    </div>
    <div class="chart-card">
      <h3>网络速率</h3>
      <canvas id="net-chart"></canvas>
      <div class="legend">
        <span><i style="background:#20a53a"></i>下行</span>
        <span><i style="background:#fb7d00"></i>上行</span>
      </div>
    </div>
  </section>

  <section class="panes">
    <div class="pane">
      <h3>磁盘分区</h3>
      <table>
        <thead><tr><th>挂载点</th><th>设备</th><th class="num">已用</th><th class="num">总量</th><th class="num">使用率</th></tr></thead>
        <tbody id="disk-body"></tbody>
      </table>
    </div>
    <div class="pane">
      <h3>进程 Top（按 CPU）</h3>
      <table>
        <thead><tr><th>PID</th><th>名称</th><th class="num">CPU%</th><th class="num">内存</th><th>命令</th></tr></thead>
        <tbody id="proc-body"></tbody>
      </table>
    </div>
  </section>

  <section class="panes">
    <div class="pane" style="grid-column:1/-1">
      <h3>Docker 容器</h3>
      <div id="docker-wrap"></div>
    </div>
  </section>
</main>

<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const HISTORY = 40;
const hist = { cpu: [], mem: [], rx: [], tx: [] };

function fmtBytes(n){
  if(n == null) return "-";
  if(n < 1024) return n + " B";
  const u = ["KB","MB","GB","TB"]; let i = -1;
  do{ n /= 1024; i++; }while(n >= 1024 && i < u.length-1);
  return n.toFixed(1) + " " + u[i];
}
function fmtRate(n){ return fmtBytes(n); }
function fmtUptime(s){
  s = Math.floor(s);
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return (d? d+"天 ":"") + h + "时" + m + "分";
}
function barClass(p){ return p >= 85 ? "bar bad" : p >= 70 ? "bar warn" : "bar"; }
function setBar(id, p){
  const el = document.getElementById(id);
  el.className = barClass(p);
  el.querySelector("i").style.width = Math.min(100, p) + "%";
}

function drawChart(canvas, series, color, maxVal, unit){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  if(!series.length) return;
  const max = maxVal || Math.max(10, ...series)*1.15;
  const step = w / (HISTORY-1);
  // 网格
  ctx.strokeStyle = "#f0f0f0"; ctx.lineWidth = 1;
  for(let g=1;g<=3;g++){ const y = h - h*g/4; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  series.forEach((arr, si)=>{
    ctx.beginPath();
    arr.forEach((v,i)=>{
      const x = i*step, y = h - (v/max)*(h-14) - 6;
      i? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.strokeStyle = color[si]; ctx.lineWidth = 2; ctx.stroke();
    // 填充
    ctx.lineTo((arr.length-1)*step, h); ctx.lineTo(0, h); ctx.closePath();
    ctx.fillStyle = color[si]+"22"; ctx.fill();
  });
}

function render(s){
  // 系统
  document.getElementById("m-hostname").textContent = s.system.hostname;
  document.getElementById("m-os").textContent = s.system.os;
  document.getElementById("m-kernel").textContent = s.system.kernel;
  document.getElementById("m-uptime").textContent = fmtUptime(s.system.uptime);
  document.getElementById("m-time").textContent = s.system.time;

  // CPU
  document.getElementById("cpu-cores").textContent = s.cpu.cores + " 核";
  document.getElementById("cpu-pct").textContent = s.cpu.percent;
  setBar("cpu-bar", s.cpu.percent);
  document.getElementById("cpu-load").textContent = s.cpu.load.join(" / ");

  // 内存
  document.getElementById("mem-used").textContent = fmtBytes(s.mem.used);
  document.getElementById("mem-total").textContent = fmtBytes(s.mem.total);
  document.getElementById("mem-avail").textContent = fmtBytes(s.mem.available);
  document.getElementById("mem-cached").textContent = fmtBytes(s.mem.cached);
  setBar("mem-bar", s.mem.percent);

  // Swap
  document.getElementById("swap-used").textContent = fmtBytes(s.mem.swap_used);
  document.getElementById("swap-total").textContent = fmtBytes(s.mem.swap_total);
  document.getElementById("swap-sub").textContent = s.mem.swap_total ?
    "Swap 使用率 " + (s.mem.swap_total? (s.mem.swap_used/s.mem.swap_total*100).toFixed(1):0) + "%" : "未配置交换分区";

  // 网络
  document.getElementById("net-rx").textContent = fmtRate(s.net.rx_rate);
  document.getElementById("net-tx").textContent = fmtRate(s.net.tx_rate);
  document.getElementById("net-rxt").textContent = fmtBytes(s.net.rx_total);
  document.getElementById("net-txt").textContent = fmtBytes(s.net.tx_total);

  // 历史
  hist.cpu.push(s.cpu.percent); if(hist.cpu.length>HISTORY) hist.cpu.shift();
  hist.mem.push(s.mem.percent); if(hist.mem.length>HISTORY) hist.mem.shift();
  hist.rx.push(s.net.rx_rate); if(hist.rx.length>HISTORY) hist.rx.shift();
  hist.tx.push(s.net.tx_rate); if(hist.tx.length>HISTORY) hist.tx.shift();
  drawChart(document.getElementById("cpu-chart"), [hist.cpu], ["#20a53a"], 100);
  drawChart(document.getElementById("mem-chart"), [hist.mem], ["#20a53a"], 100);
  const netMax = Math.max(...hist.rx, ...hist.tx, 1024);
  drawChart(document.getElementById("net-chart"), [hist.rx, hist.tx], ["#20a53a","#fb7d00"], netMax);

  // 磁盘
  document.getElementById("disk-body").innerHTML = s.disk.map(d=>`
    <tr>
      <td>${d.mount}</td><td>${d.device}</td>
      <td class="num">${fmtBytes(d.used)}</td><td class="num">${fmtBytes(d.total)}</td>
      <td class="num">${d.percent}%</td>
    </tr>`).join("") || `<tr><td colspan="5" class="empty">无分区数据</td></tr>`;

  // 进程
  document.getElementById("proc-body").innerHTML = s.procs.map(p=>`
    <tr>
      <td>${p.pid}</td><td>${p.name}</td>
      <td class="num">${p.cpu}</td><td class="num">${fmtBytes(p.rss)}</td>
      <td class="cmd">${escapeHtml(p.cmd)}</td>
    </tr>`).join("") || `<tr><td colspan="5" class="empty">无进程数据</td></tr>`;

  // Docker
  const dw = document.getElementById("docker-wrap");
  if(!s.docker.available){
    dw.innerHTML = `<div class="empty">Docker 不可用：${s.docker.error||"-"}</div>`;
  } else if(!s.docker.containers.length){
    dw.innerHTML = `<div class="empty">没有运行中的容器</div>`;
  } else {
    dw.innerHTML = `<table><thead><tr><th>名称</th><th>镜像</th><th>状态</th><th>端口</th></tr></thead><tbody>` +
      s.docker.containers.map(c=>`<tr>
        <td><span class="tag ok">${escapeHtml(c.name)}</span></td>
        <td>${escapeHtml(c.image)}</td><td>${escapeHtml(c.status)}</td>
        <td class="cmd">${escapeHtml(c.ports)}</td></tr>`).join("") + `</tbody></table>`;
  }
}

function escapeHtml(str){
  return String(str||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

async function refresh(){
  const dot = document.getElementById("dot"), st = document.getElementById("status-text");
  try{
    const url = "/api/status" + (TOKEN? "?token="+encodeURIComponent(TOKEN) : "");
    const r = await fetch(url, {cache:"no-store"});
    if(r.status === 401){ throw new Error("401 未授权"); }
    const s = await r.json();
    render(s);
    dot.className = "dot on"; st.textContent = "在线 · " + new Date().toLocaleTimeString();
  }catch(e){
    dot.className = "dot off"; st.textContent = "离线：" + e.message;
  }
}

refresh();
setInterval(refresh, 3000);
window.addEventListener("resize", ()=>{
  drawChart(document.getElementById("cpu-chart"),[hist.cpu],["#20a53a"],100);
  drawChart(document.getElementById("mem-chart"),[hist.mem],["#20a53a"],100);
  drawChart(document.getElementById("net-chart"),[hist.rx,hist.tx],["#20a53a","#fb7d00"],Math.max(...hist.rx,...hist.tx,1024));
});
</script>
</body>
</html>
